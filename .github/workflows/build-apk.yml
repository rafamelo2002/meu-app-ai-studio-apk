name: Compilar APK Android (Meu_App_AI_Studio)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Aceitar Licenças do Android SDK
      run: |
        yes | sdkmanager --licenses || true

    - name: Gerar Gradle Wrapper e Configurar Permissões
      run: |
        gradle wrapper --gradle-version 8.4 --distribution-type bin
        chmod +x gradlew

    - name: Compilar APK com Gradle
      run: ./gradlew assembleDebug --stacktrace

    - name: Renomear APK de saída
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk Meu_App_AI_Studio-debug.apk

    - name: Fazer Upload do Arquivo APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: Meu_App_AI_Studio-Android-APK
        path: Meu_App_AI_Studio-debug.apk
        retention-days: 30

    - name: Criar Release Automática com Download Direto do APK
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        files: Meu_App_AI_Studio-debug.apk
        tag_name: v1.0.0
        name: "Meu App AI Studio v1.0.0 (.APK)"
        body: |
          ### 🎉 Seu APK Android está pronto para instalação!
          - **App:** Meu App AI Studio
          - **Pacote:** `com.aistudio.meuapp`
          - **Versão:** 1.0.0
          - **URL Alvo:** https://ais-pre-lx5w2bpcn6mo4pagrrd5bd-589460615465.us-east1.run.app
          
          Baixe o arquivo `Meu_App_AI_Studio-debug.apk` abaixo e instale diretamente no seu celular Android.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
